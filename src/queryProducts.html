<!doctype html>
<html lang="en">
  <head>
    <title>Fake Product Identification</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href='https://fonts.googleapis.com/css?family=Roboto:400,100,300,700' rel='stylesheet'>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
      /* Background */
      body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                    url("images/bg.jpg"); /* Replace with your background image */
        background-size: cover;
        background-attachment: fixed;
        color: #f8f9fa;
      }

      /* Navbar */
      .navbar {
        background: rgba(0, 0, 0, 0.85) !important;
        backdrop-filter: blur(6px);
        border-bottom: 2px solid #ffcc00;
      }
      .navbar-brand {
        font-weight: bold;
        color: #ffcc00 !important;
      }
      .navbar-brand span {
        font-size: 0.9rem;
        color: #fff;
        display: block;
      }
      .nav-link {
        font-weight: 500;
        transition: 0.3s;
      }
      .nav-link:hover {
        color: #ffcc00 !important;
        transform: scale(1.05);
      }

      /* Section headers */
      h2 {
        text-align: center;
        margin: 30px 0;
        color: #ffcc00;
        font-weight: 700;
        text-transform: uppercase;
      }

      /* Form */
      .form-control {
        border-radius: 12px;
        padding: 12px;
        border: 1px solid #444;
        background: rgba(255,255,255,0.1);
        color: #fff;
      }
      .form-control:focus {
        border-color: #ffcc00;
        box-shadow: 0 0 10px rgba(255,204,0,0.5);
      }
      .btn-warning {
        border-radius: 25px;
        padding: 10px 25px;
        font-weight: bold;
        transition: 0.3s;
      }
      .btn-warning:hover {
        background: #ff9900;
        transform: scale(1.05);
      }

      /* Table */
      .table {
        background: rgba(0,0,0,0.6);
        border-radius: 15px;
        overflow: hidden;
        color: #fff;
      }
      .table thead {
        background: #ffcc00;
        color: #000;
      }
      .table tbody tr:hover {
        background: rgba(255,255,255,0.1);
        transition: 0.3s;
      }

      /* Small card-like effect for sections */
      section.container {
        background: rgba(0,0,0,0.4);
        padding: 30px;
        border-radius: 15px;
        margin-bottom: 40px;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Fake Product Identification 
          <span>through Blockchain</span>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#ftco-nav">
          <span class="fa fa-bars"></span>
        </button>
        <div class="collapse navbar-collapse" id="ftco-nav">
          <ul class="navbar-nav m-auto">
            <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="manufacturer.html" class="nav-link">Manufacturer</a></li>
            <li class="nav-item"><a href="seller.html" class="nav-link">Seller</a></li>
            <li class="nav-item"><a href="consumer.html" class="nav-link">Consumer</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Seller Code Form -->
    <section class="container">
      <h2>Products for Sale with the Seller</h2>
      <div class="form-group">
        <label for="sellerCode">Seller Code</label>
        <input type="text" class="form-control" id="sellerCode" placeholder="Enter Seller Code">
      </div>
      <button type="submit" class="btn btn-warning" id="register">Submit</button>
    </section>

    <!-- Product Table -->
    <section class="container">
      <h2>Product Details</h2>
      <table class="table">
        <thead>
          <tr>
            <th>Product ID</th>
            <th>Product Serial Number</th>
            <th>Product Name</th>
            <th>Product Brand</th>
            <th>Product Price</th>
            <th>Product Status</th>
          </tr>
        </thead>
        <tbody id="logdata"></tbody>
      </table>
      <center><p>Your address is <b id="add"></b></p></center>
    </section>

    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="js/popper.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/web3.min.js"></script>
    <script src="js/truffle-contract.js"></script>
    <script src="js/productDataApp.js"></script>
  </body>
</html>
